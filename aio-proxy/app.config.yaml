application:
  actions: actions
  runtimeManifest:
    packages:
      aem-proxy:
        license: Apache-2.0
        actions:
          proxy:
            function: actions/proxy/index.js
            runtime: nodejs:20
            web: raw
            inputs:
              AEM_HOST: $AEM_HOST
              ALLOWED_ORIGINS: $ALLOWED_ORIGINS
            annotations:
              require-adobe-auth: false
              final: true
