<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WKND Headless Demos</title>
<!-- Not editable content: the Universal Editor library is loaded only so the editor connects instead of timing out -->
<meta name="urn:adobe:aue:system:aemconnection" content="aem:%AEM_AUTHOR_URL%" />
<script src="https://universal-editor-service.adobe.io/cors.js" async></script>
<style>
  :root { --bg:#f5f5f4; --card:#fff; --text:#1c1917; --muted:#57534e; --accent:#2563eb; --border:#e7e5e4; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141413; --card:#1f1e1d; --text:#f5f5f4; --muted:#a8a29e; --accent:#60a5fa; --border:#33312f; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text);
         font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:880px; margin:0 auto; padding:64px 16px; }
  h1 { font-size:2rem; margin:0 0 8px; }
  p.lead { color:var(--muted); margin:0 0 40px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:20px; }
  a.card { display:flex; flex-direction:column; gap:10px; padding:24px; background:var(--card);
           border:1px solid var(--border); border-radius:14px; color:inherit; text-decoration:none;
           transition:transform .15s, box-shadow .15s, border-color .15s; }
  a.card:hover, a.card:focus-visible { transform:translateY(-3px); border-color:var(--accent);
           box-shadow:0 10px 24px rgba(0,0,0,.12); outline:none; }
  .tag { align-self:flex-start; font-size:.75rem; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
         color:var(--accent); border:1px solid var(--accent); border-radius:999px; padding:2px 10px; }
  h2 { margin:0; font-size:1.35rem; }
  .desc { color:var(--muted); margin:0; line-height:1.5; }
  .go { margin-top:auto; padding-top:8px; color:var(--accent); font-weight:600; }
</style>
</head>
<body>
<main>
  <h1>WKND Headless Demos</h1>
  <p class="lead">Two front ends reading the same AEM GraphQL content.</p>
  <div class="cards">
    <a class="card" href="next-js/">
      <span class="tag">Next.js</span>
      <h2>Next.js app</h2>
      <p class="desc">Statically generated pages for the WKND adventures, built at deploy time.</p>
      <span class="go">Open app &rarr;</span>
    </a>
    <a class="card" href="react-app/">
      <span class="tag">React</span>
      <h2>React app</h2>
      <p class="desc">Single-page app that fetches the adventures from AEM in the browser.</p>
      <span class="go">Open app &rarr;</span>
    </a>
  </div>
</main>
</body>
</html>
