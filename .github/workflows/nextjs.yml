# Build and deploy the Next.js application in next-js/ to GitHub Pages
name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./next-js
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/next-js/yarn.lock" ]; then
            echo "manager=yarn" >> "$GITHUB_OUTPUT"
            echo "command=install" >> "$GITHUB_OUTPUT"
            echo "runner=yarn" >> "$GITHUB_OUTPUT"
          elif [ -f "${{ github.workspace }}/next-js/package.json" ]; then
            echo "manager=npm" >> "$GITHUB_OUTPUT"
            echo "command=ci" >> "$GITHUB_OUTPUT"
            echo "runner=npx --no-install" >> "$GITHUB_OUTPUT"
          else
            echo "Unable to determine package manager"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: ${{ steps.detect-package-manager.outputs.manager }}
          cache-dependency-path: next-js/*lock*

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: next-js/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('next-js/package-lock.json', 'next-js/yarn.lock') }}-${{ hashFiles('next-js/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('next-js/package-lock.json', 'next-js/yarn.lock') }}-

      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}

      - name: Build with Next.js
        run: |
          ${{ steps.detect-package-manager.outputs.runner }} next build
          ${{ steps.detect-package-manager.outputs.runner }} next export
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}/next-js
          NEXT_PUBLIC_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/next-js
          NEXT_PUBLIC_AEM_HOST: ${{ vars.NEXT_PUBLIC_AEM_HOST }}
          NEXT_PUBLIC_AEM_PROXY_URL: ${{ vars.AEM_PROXY_URL }}
          NEXT_PUBLIC_AEM_AUTH_TOKEN: ${{ vars.AEM_AUTH_TOKEN }}
          NEXT_PUBLIC_AEM_GRAPHQL_ENDPOINT: ${{ vars.NEXT_PUBLIC_AEM_GRAPHQL_ENDPOINT }}

      - name: Install React app dependencies
        working-directory: ./react-app
        run: npm ci

      - name: Build React app
        working-directory: ./react-app
        run: npm run build
        env:
          PUBLIC_URL: /${{ github.event.repository.name }}/react-app
          REACT_APP_USE_HASH_ROUTER: "true"
          REACT_APP_USE_PROXY: "false"
          REACT_APP_PROXY_URL: ${{ vars.AEM_PROXY_URL }}
          REACT_APP_AUTH_TOKEN: ${{ vars.AEM_AUTH_TOKEN }}
          REACT_APP_HOST_URI: ${{ vars.NEXT_PUBLIC_AEM_HOST }}
          REACT_APP_GRAPHQL_ENDPOINT: ${{ vars.NEXT_PUBLIC_AEM_GRAPHQL_ENDPOINT }}
          REACT_APP_UE_AEM_AUTHOR_URI: ${{ vars.AEM_AUTHOR_URL }}

      - name: Assemble site
        run: |
          mkdir -p site
          cp -R out site/next-js
          cp -R ../react-app/build site/react-app
          touch site/.nojekyll
          cp ../.github/pages/index.html site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./next-js/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
